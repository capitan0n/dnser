name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the job only needs to read the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # Actions are pinned to commit SHAs so a moved tag can't swap the code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: python -m pytest
