name: publish

# Publishing a GitHub release (tag vX.Y.Z) builds and uploads to PyPI.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repo.
on:
  release:
    types: [published]

# Least privilege by default; only the publish job gets an OIDC token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions are pinned to commit SHAs so a moved tag can't swap the code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # PyPI never accepts the same version twice, so catch a forgotten
      # bump before anything is built.
      - name: Check tag matches version
        run: |
          version=$(python -c 'import dnser; print(dnser.__version__)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match dnser.__version__ ($version)"
            exit 1
          fi

      - name: Install
        run: python -m pip install -e '.[dev]' build twine

      - name: Test
        run: python -m pytest

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Must match the environment name set in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/dnser/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
