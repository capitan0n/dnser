[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnser"
version = "0.4.0"
description = "Terminal-first DNS switcher for Linux — backend-agnostic (NetworkManager, systemd-resolved)"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "capitan0n" }
]
keywords = ["dns", "networkmanager", "systemd-resolved", "linux", "cli", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]

dependencies = [
    "rich>=13.0",  # για ωραίο output (πίνακες, χρώματα)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

# Δημιουργεί το `dnser` command στο PATH μετά το install
[project.scripts]
dnser = "dnser.cli:main"

[project.urls]
Homepage = "https://github.com/capitan0n/dnser"
Issues = "https://github.com/capitan0n/dnser/issues"
Source = "https://github.com/capitan0n/dnser"

[tool.setuptools.packages.find]
where = ["."]
include = ["dnser*"]

# providers.json ζει στο repo root — bundled μέσω package-data ώστε να
# φτάνει και σε wheel installs (αντιγράφεται στο πακέτο κατά το build).
# Editable installs (pipx install --editable .) βρίσκουν το ίδιο αρχείο
# απευθείας από το repo root — το providers.py ψάχνει σε ../providers.json
# σε σχέση με τον φάκελο του package.
[tool.setuptools.package-data]
dnser = ["../providers.json"]
