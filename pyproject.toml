[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnser"
version = "0.3.0"
description = "Terminal-first DNS switcher for Linux — backend-agnostic (NetworkManager, systemd-resolved)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Alex" }
]
keywords = ["dns", "networkmanager", "systemd-resolved", "linux", "cli", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]

# Runtime dependencies — κρατάμε τα minimum για τη φάση 1
# Θα προσθέσουμε dnspython (benchmark) και questionary (TUI) σε επόμενες φάσεις
dependencies = [
    "rich>=13.0",  # για ωραίο output (πίνακες, χρώματα)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

# Αυτό είναι το κρίσιμο: δημιουργεί το `dnser` command στο PATH μετά το install
[project.scripts]
dnser = "dnser.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USER/dnser"
Issues = "https://github.com/YOUR_USER/dnser/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dnser*"]

# Include το providers.json στο package
[tool.setuptools.package-data]
dnser = ["../config/providers.json"]
